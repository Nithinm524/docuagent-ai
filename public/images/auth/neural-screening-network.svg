<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#081329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#cyanGlow)"/>
  <rect width="1600" height="1200" fill="url(#tealGlow)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <!-- Neural Network Lattice -->
  <g stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="250" y1="350" x2="520" y2="280"/>
    <line x1="520" y1="280" x2="800" y2="420"/>
    <line x1="800" y1="420" x2="1100" y2="300"/>
    <line x1="1100" y1="300" x2="1350" y2="450"/>
    
    <line x1="520" y1="280" x2="650" y2="580"/>
    <line x1="800" y1="420" x2="950" y2="680"/>
    <line x1="1100" y1="300" x2="1200" y2="600"/>
    
    <line x1="380" y1="620" x2="650" y2="580"/>
    <line x1="650" y1="580" x2="950" y2="680"/>
    <line x1="950" y1="680" x2="1280" y2="780"/>
    
    <line x1="650" y1="580" x2="550" y2="880"/>
    <line x1="950" y1="680" x2="880" y2="920"/>
    <line x1="1200" y1="600" x2="1280" y2="780"/>
  </g>

  <!-- Concentric Security Target Rings -->
  <g transform="translate(800, 520)" filter="url(#glow)">
    <circle r="220" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="12 8"/>
    <circle r="160" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.5"/>
    <circle r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="6 4"/>
    <circle r="12" fill="#22d3ee" fill-opacity="0.9"/>
  </g>

  <!-- Neural Nodes -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="250" cy="350" r="7"/>
    <circle cx="520" cy="280" r="9"/>
    <circle cx="800" cy="420" r="12" fill="#38bdf8"/>
    <circle cx="1100" cy="300" r="8"/>
    <circle cx="1350" cy="450" r="6"/>
    <circle cx="380" cy="620" r="8"/>
    <circle cx="650" cy="580" r="10"/>
    <circle cx="950" cy="680" r="11"/>
    <circle cx="1200" cy="600" r="7"/>
    <circle cx="1280" cy="780" r="9"/>
    <circle cx="550" cy="880" r="6"/>
    <circle cx="880" cy="920" r="8"/>
  </g>

  <!-- High-Tech Telemetry Labels -->
  <text x="260" y="380" fill="#38bdf8" font-family="monospace" font-size="14" opacity="0.75">NODE::EXTRACT_01 [VALID]</text>
  <text x="820" y="400" fill="#22d3ee" font-family="monospace" font-size="16" font-weight="bold" opacity="0.9">DOCUAGENT::NEURAL_CORE</text>
  <text x="965" y="710" fill="#14b8a6" font-family="monospace" font-size="14" opacity="0.75">TELEMETRY::CONFIDENCE 99.4%</text>
  <text x="1115" y="280" fill="#38bdf8" font-family="monospace" font-size="14" opacity="0.65">SCHEMA::DETERMINISTIC_PASS</text>
</svg>
