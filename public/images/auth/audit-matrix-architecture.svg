<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <linearGradient id="auditBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="45%" stop-color="#071326"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="matrixGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="matrixBloom">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="url(#auditBg)"/>
  <rect width="1600" height="1200" fill="url(#matrixGlow)"/>

  <!-- Matrix Data Columns -->
  <g stroke="url(#streamGrad)" stroke-width="2" opacity="0.6">
    <line x1="200" y1="100" x2="200" y2="1100"/>
    <line x1="380" y1="50" x2="380" y2="1150"/>
    <line x1="560" y1="120" x2="560" y2="1080"/>
    <line x1="740" y1="80" x2="740" y2="1120"/>
    <line x1="920" y1="40" x2="920" y2="1160"/>
    <line x1="1100" y1="100" x2="1100" y2="1100"/>
    <line x1="1280" y1="60" x2="1280" y2="1140"/>
    <line x1="1440" y1="120" x2="1440" y2="1080"/>
  </g>

  <!-- Hexagonal Audit Chamber Node Grid -->
  <g transform="translate(800, 580)" filter="url(#matrixBloom)">
    <!-- Central Shield Hexagon -->
    <polygon points="0,-160 140,-80 140,80 0,160 -140,80 -140,-80" fill="#082f49" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="0,-120 105,-60 105,60 0,120 -105,60 -105,-60" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="10 5"/>
    <circle r="40" fill="#0284c7" fill-opacity="0.6" stroke="#67e8f9" stroke-width="2"/>
    <circle r="15" fill="#e0f2fe"/>

    <!-- Surrounding Audit Satellite Nodes -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4">
      <line x1="0" y1="-160" x2="0" y2="-280"/>
      <circle cx="0" cy="-280" r="16" fill="#0369a1"/>

      <line x1="140" y1="-80" x2="250" y2="-140"/>
      <circle cx="250" cy="-140" r="16" fill="#0369a1"/>

      <line x1="140" y1="80" x2="250" y2="140"/>
      <circle cx="250" cy="140" r="16" fill="#0369a1"/>

      <line x1="0" y1="160" x2="0" y2="280"/>
      <circle cx="0" cy="280" r="16" fill="#0369a1"/>

      <line x1="-140" y1="80" x2="-250" y2="140"/>
      <circle cx="-250" cy="140" r="16" fill="#0369a1"/>

      <line x1="-140" y1="-80" x2="-250" y2="-140"/>
      <circle cx="-250" cy="-140" r="16" fill="#0369a1"/>
    </g>
  </g>

  <!-- Audit Trail Event Markers -->
  <g fill="#38bdf8" font-family="monospace" font-size="13">
    <text x="120" y="800" opacity="0.8">AUDIT::FIELD_VALIDATED (Passport_No)</text>
    <text x="120" y="825" opacity="0.6" fill="#94a3b8">TIMESTAMP::2026-10-26T00:38:11Z</text>
    <text x="120" y="850" opacity="0.8" fill="#2dd4bf">ACTOR::HUMAN_IN_THE_LOOP_SPECIALIST</text>

    <text x="1140" y="800" opacity="0.8">ROUTING::PRIORITY_REVIEW_QUEUE</text>
    <text x="1140" y="825" opacity="0.6" fill="#94a3b8">DECISION::POLICY_RULE_04_MATCHED</text>
    <text x="1140" y="850" opacity="0.8" fill="#38bdf8">INTEGRITY_SEAL::ED25519_VERIFIED</text>
  </g>
</svg>
